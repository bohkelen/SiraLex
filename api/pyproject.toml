[project]
name = "siralex-api"
version = "0.1.0"
description = "SiraLex backend services: snapshot engine, ingestion, and API"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "zstandard>=0.22.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[project.scripts]
siralex-crawl = "snapshot_engine.cli:main"
siralex-parse-ir = "ir_parser.cli:main"
siralex-build-index = "search_index.cli:main"
siralex-build-bundle = "bundle_builder.cli:main"
siralex-enrich = "enrichment.cli:main"
siralex-validate-enrichment-display-only = "enrichment.validate_enrichment_display_only:main"
siralex-corrections-dry-run = "corrections.cli:main"
siralex-validate-source-aliases = "source_aliases.validate_alias_table:main"
siralex-apply-source-aliases = "source_aliases.apply_aliases_to_search_index:main"
siralex-validate-source-index-supplements = "source_index_supplements.validate_supplements:main"
siralex-generate-source-index-supplements = "source_index_supplements.generate_supplement_records:main"
siralex-merge-source-index-supplements = "source_index_supplements.merge_supplements_into_search_index:main"
siralex-mine-source-index-gaps = "source_index_gap_discovery.mine_candidates:main"
siralex-validate-corpus-sources = "corpus_sources.validate_corpus_sources:main"
siralex-validate-corpus-artifacts = "corpus_artifacts.validate_corpus_artifacts:main"
siralex-validate-corpus-segments = "corpus_segments.validate_corpus_segments:main"
siralex-validate-corpus-annotations = "corpus_annotations.validate_corpus_annotations:main"
siralex-validate-corpus-reviews = "corpus_reviews.validate_corpus_reviews:main"
siralex-export-corpus-review-worksheet = "corpus_reviews.export_review_worksheet:main"
siralex-corpus-review-dry-run = "corpus_reviews.dry_run_import_reviews:main"
siralex-write-corpus-reviews = "corpus_reviews.write_corpus_reviews:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.hatch.build.targets.wheel]
packages = [
    "snapshot_engine",
    "ir_parser",
    "search_index",
    "bundle_builder",
    "enrichment",
    "corrections",
    "source_aliases",
    "source_index_supplements",
    "source_index_gap_discovery",
    "corpus_sources",
    "corpus_artifacts",
    "corpus_segments",
    "corpus_annotations",
    "corpus_reviews",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
