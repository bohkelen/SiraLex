name: Phase 7L search regression

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-search-regression:
    name: Phase 7L Python regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install Python test dependencies
        run: pip install -e "./api[dev]"

      - name: Run Phase 7L Python matrix validation and replay
        run: |
          python3 -m pytest \
            api/search_regression/tests/test_validate_matrix.py \
            api/search_regression/tests/test_replay_golden.py \
            -q

  runtime-search-regression:
    name: Phase 7L Runtime regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Run Phase 7L runtime search regression
        working-directory: web
        run: npx vitest run -c vitest.search_regression.config.ts

      - name: Run searchQuery unit regression
        working-directory: web
        run: npx vitest run src/search/search_query.test.ts
