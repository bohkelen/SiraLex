<?xml version="1.0" encoding="UTF-8"?>
<!--
  SiraLex · Favicon SVG
  32×32 viewBox. Mark in cream (#F4EDE3) on terracotta (#B85C38) rounded square.
  Modern browsers use this at 16px, 32px, and larger — the SVG scales cleanly.
  SiraLex logo assets v1
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 32 32"
  fill="none"
  role="img"
  aria-label="SiraLex"
>
  <title>SiraLex</title>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="6.4" fill="#B85C38"/>
  <!-- Mark scaled to fit centered in 32×32 with ~18% padding -->
  <!-- Source viewBox 80×108 → rendered ~17×23 inside 32×32 -->
  <svg x="7" y="4" width="18" height="24" viewBox="0 0 80 108">
    <path
      d="M 36 16 L 54 16 C 70 16 78 28 70 46 C 62 62 42 64 36 78 C 30 92 40 102 58 100"
      stroke="#F4EDE3"
      stroke-width="10"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </svg>
</svg>
